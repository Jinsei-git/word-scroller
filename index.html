<!DOCTYPE html>
<html lang="ja">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {

                    fontFamily: {

</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 py-6 px-4 sm:px-6 antialiased selection:bg-indigo-500 selection:text-white">

    <div class="max-w-2xl mx-auto space-y-6">

        <!-- Header -->
        <header class="text-center py-4 bg-white rounded-2xl shadow-sm border border-slate-200/80 px-4">
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight">
                ランダムワードスクローラー
            </h1>
        </header>

        <!-- SINGLE SLOT SECTION (TOP) -->
        <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-md border border-slate-200/80 transition-all duration-300 hover:shadow-lg">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
                        1
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-800 text-base sm:text-lg leading-tight">テーマルーレット</h2>
                    </div>
                </div>
            </div>

            <!-- Slot Display Area -->
            <div class="slot-window relative h-28 sm:h-32 rounded-2xl overflow-hidden border-2 border-slate-800 flex items-center justify-center shadow-inner mb-4">
                <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/40 pointer-events-none z-10"></div>
                <div id="top-display" class="text-2xl sm:text-4xl font-extrabold text-amber-300 tracking-wider text-center px-4 transition-transform duration-75 drop-shadow-[0_2px_8px_rgba(251,191,36,0.3)]">
                    READY
                </div>
            </div>

            <!-- Controls -->
            <div class="space-y-4">
                <button id="top-btn" onclick="startTopSpin()" class="w-full py-3.5 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-base rounded-xl shadow-md hover:shadow-glow-blue active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play text-sm"></i>
                    <span>スタート</span>
                </button>

                <!-- Input Accordion / Area -->
                <div class="border border-slate-200 rounded-xl overflow-hidden bg-slate-50/50">
                    <div class="px-4 py-2.5 bg-slate-100/70 border-b border-slate-200 text-xs font-bold text-slate-600 flex items-center justify-between">
                        <span><i class="fa-solid fa-[#1e293b] fa-list-ul mr-1.5"></i> テーマリスト (1行に1つ)</span>
                        <span id="top-count" class="text-slate-400 font-normal">5項目</span>
                    </div>
                    <textarea id="top-words-input" oninput="updateCounts()" rows="3" class="w-full p-3 bg-transparent text-sm text-slate-700 focus:outline-none focus:bg-white resize-y custom-scrollbar font-sans" placeholder="1行に1つ言葉を入力...">強盗の後&#10;生放送５分前&#10;無人島漂着１日目&#10;葬式の帰り道&#10;爆弾解体中&#10;地球最後の日&#10;終電を逃した直後&#10;尋問室の取り調べ&#10;手術室の前&#10;カンニングが発覚&#10;告白された直後&#10;結婚式当日の控え室&#10;タイムトラベル&#10;事故現場の目撃&#10;秘密基地への侵入&#10;大炎上した直後&#10;逃亡生活３日目&#10;仲直り&#10;エレベーターに閉じ込められた&#10;告発文が届いた&#10;記憶喪失の目覚め&#10;解散についての話し合い&#10;不法侵入がバレた瞬間&#10;冷蔵庫の中のプリン&#10;宇宙船の酸素残量５％&#10;遺産相続の話し合い&#10;クビを言い渡された帰り道&#10;同窓会で元カレ・元カノと再会&#10;事件現場の初動捜査&#10;テスト用紙返却&#10;ゾンビパンデミック初日&#10;整形手術の包帯を外す瞬間&#10;密室からの脱出&#10;浮気がバレた&#10;エイリアン遭遇の翌朝&#10;デスゲームの最初の脱落者が出た直後&#10;退職届を出した直後&#10;裁判の判決言い渡し直前&#10;偽装結婚の契約初日&#10;遭難&#10;失恋直後の一人カラオケ&#10;準優勝&#10;盗聴器を見つけた瞬間&#10;誘拐犯からの電話中&#10;出所した日の刑務所前&#10;カンニングペーパーを呑み込んだ直後&#10;夜逃げの準備中&#10;初デートの待ち合わせ１０分前&#10;王様が崩御した直後&#10;AIが反乱を起こした初日&#10;卒業式の誰もいない教室&#10;闇オークションの開始前&#10;偽物だと気づいた鑑定結果&#10;遺体安置所での身元確認&#10;宝くじ大当たり&#10;記憶が戻った瞬間&#10;全校集会&#10;記者会見前&#10;ラストライブの開演直前&#10;親友と同じ人を好きだと知った直後&#10;家族会議&#10;タイムカプセル掘り起し&#10;街頭ティッシュ配り&#10;文化祭</textarea>
                </div>
            </div>
        </section>

        <!-- TRIPLE SLOT SECTION (BOTTOM) -->
        <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-md border border-slate-200/80 transition-all duration-300 hover:shadow-lg">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-sm">
                        3
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-800 text-base sm:text-lg leading-tight">セリフルーレット</h2>
                    </div>
                </div>
            </div>

            <!-- Slot Display Area (3 Slots Stacked Vertically) -->
            <div class="flex flex-col gap-2.5 mb-4">
                <!-- Slot 1 -->
                <div class="slot-window relative h-16 sm:h-20 rounded-2xl overflow-hidden border-2 border-slate-800 flex items-center justify-center shadow-inner">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/40 pointer-events-none z-10"></div>
                    <div id="bottom-display-0" class="text-lg sm:text-2xl font-bold text-emerald-400 text-center px-4 drop-shadow-[0_2px_6px_rgba(52,211,153,0.3)]">
                        #1
                    </div>
                </div>
                <!-- Slot 2 -->
                <div class="slot-window relative h-16 sm:h-20 rounded-2xl overflow-hidden border-2 border-slate-800 flex items-center justify-center shadow-inner">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/40 pointer-events-none z-10"></div>
                    <div id="bottom-display-1" class="text-lg sm:text-2xl font-bold text-emerald-400 text-center px-4 drop-shadow-[0_2px_6px_rgba(52,211,153,0.3)]">
                        #2
                    </div>
                </div>
                <!-- Slot 3 -->
                <div class="slot-window relative h-16 sm:h-20 rounded-2xl overflow-hidden border-2 border-slate-800 flex items-center justify-center shadow-inner">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/40 pointer-events-none z-10"></div>
                    <div id="bottom-display-2" class="text-lg sm:text-2xl font-bold text-emerald-400 text-center px-4 drop-shadow-[0_2px_6px_rgba(52,211,153,0.3)]">
                        #3
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="space-y-4">
                <button id="bottom-btn" onclick="startBottomSpin()" class="w-full py-3.5 px-6 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-base rounded-xl shadow-md hover:shadow-glow-emerald active:scale-[0.99] transition-all duration-150 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play text-sm"></i>
                    <span>スタート</span>
                </button>

                <!-- Input Area -->
                <div class="border border-slate-200 rounded-xl overflow-hidden bg-slate-50/50">
                    <div class="px-4 py-2.5 bg-slate-100/70 border-b border-slate-200 text-xs font-bold text-slate-600 flex items-center justify-between">
                        <span><i class="fa-solid fa-list-ul mr-1.5"></i> セリフリスト (最低3つ必要)</span>
                        <span id="bottom-count" class="text-slate-400 font-normal">7項目</span>
                    </div>
                    <textarea id="bottom-words-input" oninput="updateCounts()" rows="4" class="w-full p-3 bg-transparent text-sm text-slate-700 focus:outline-none focus:bg-white resize-y custom-scrollbar font-sans" placeholder="1行に1つ言葉を入力...">「知ってたんだろ。」&#10;「待って、行かないで。」&#10;「鍵、開いてるよ。」&#10;「最初から嘘だったんだ。」&#10;「笑ってよ、いつもみたいに。」&#10;「誰も見てないよ。」&#10;「名前、呼んでみて。」&#10;「逃げたわけじゃない。」&#10;「忘れたことなんてないよ。」&#10;「ここ、座れば？」&#10;「もう一度言って。」&#10;「雨、強くなってきたね。」&#10;「諦めたわけじゃない。」&#10;「触らないで。」&#10;「本当のこと、話して。」&#10;「言わなきゃダメ？」&#10;「探さないでって言ったのに。」&#10;「まだ終わってないよ。」&#10;「許してくれる？」&#10;「一人で行くよ。」&#10;「覚えてる、あの日のこと。」&#10;「もう遅いよ。」&#10;「どこへ行くの？」&#10;「信じてたのに。」&#10;「こっち見ないで。」&#10;「嘘つき。」&#10;「静かにして。」&#10;「助けに来たよ。」&#10;「誰にも言わないでね。」&#10;「やっぱり駄目だった。」&#10;「手、握ってて。」&#10;「何があったの？」&#10;「帰ろうか。」&#10;「置いていかないで。」&#10;「分かってたよ。」&#10;「怒ってないよ。」&#10;「もういいよ。」&#10;「迎えに来た。」&#10;「私じゃ駄目？」&#10;「バイバイ。」&#10;「隠さなくていいよ。」&#10;「次は何？」&#10;「顔、赤いよ。」&#10;「やめてよ。」&#10;「どこに隠したの？」&#10;「聞こえなかった。」&#10;「全部、忘れて。」&#10;「一緒に来て。」&#10;「見つけた。」&#10;「意味、わかる？」&#10;「もう泣かないで。」&#10;「誰のせい？」&#10;「あと少しだけ。」&#10;「騙されないよ。」&#10;「代わりなんていない。」&#10;「逃げようか。」&#10;「どうして今さら？」&#10;「言った通りでしょ。」&#10;「こっち来て。」&#10;「まだ残ってるよ。」&#10;「理由を聞かせて。」&#10;「気にしないで。」&#10;「好きにしなよ。」&#10;「何見てるの？」&#10;「これで満足？」&#10;「最初からやり直そう。」&#10;「そこ、どいて。」&#10;「信じられない。」&#10;「時間がないよ。」&#10;「無理しないで。」&#10;「聞こえてる？」&#10;「もう追ってこないで。」&#10;「ずっと待ってた。」&#10;「言わなきゃよかった。」&#10;「準備できた？」&#10;「声が小さい。」&#10;「見なかったことにする。」&#10;「誰に聞いたの？」&#10;「離して。」&#10;「本当は怖いくせに。」&#10;「もう大丈夫だよ。」&#10;「どこかで会った？」&#10;「それ、本気？」&#10;「後悔してない？」&#10;「ここでお別れだね。」&#10;「振り向かないで。」&#10;「知らなきゃよかった。」&#10;「何か飲む？」&#10;「答えになってないよ。」&#10;「まだ話は終わってない。」&#10;「夢じゃないよね。」&#10;「勝手に決めないで。」&#10;「どうなったって知らないよ。」&#10;「やっぱりね。」&#10;「急に言われても。」&#10;「私の勝ちだね。」&#10;「どこから入ったの？」&#10;「全部自分のせいでしょ。」&#10;「忘れ物だよ。」&#10;「息、止めて。」&#10;「どうして黙ってるの？」&#10;「次はないからね。」&#10;「あの頃に戻りたい。」&#10;「言いたいことはそれだけ？」&#10;「目、逸らさないで。」&#10;「何も変わってないよ。」&#10;「そこ、危ないよ。」&#10;「本当にいいの？」&#10;「約束、覚えてる？」&#10;「もう二度と会わない。」&#10;「ちょっと待って。」&#10;「私、間違ってる？」&#10;「誰か来ちゃうよ。」&#10;「まだ信じられない。」&#10;「別にどうでもいいよ。」&#10;「どこで間違えたんだろう。」&#10;「ちゃんと見てて。」&#10;「許されると思う？」&#10;「今なんて言ったの？」&#10;「もう諦めよう。」</textarea>
                </div>
            </div>
        </section>

        <!-- Message Toast / Modal container -->
        <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none z-50 transform translate-y-4 text-sm font-semibold">
            <i id="toast-icon" class="fa-solid fa-circle-info text-amber-400"></i>
            <span id="toast-message">メッセージ</span>
        </div>

        <footer class="text-center text-xs text-slate-400 py-2">
            Random Word Scroller App &copy; Local & Mobile Ready
        </footer>

    </div>

    <!-- Application Logic -->
    <script>
        // App State
        let isTopSpinning = false;
        let isBottomSpinning = false;

        // Sound / Audio Feedback using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTickSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        function playStopSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        }

        // Parse words from textarea
        function getWords(elementId) {
            const raw = document.getElementById(elementId).value;
            return raw.split('\n').map(w => w.trim()).filter(w => w.length > 0);
        }

        // Update word counters
        function updateCounts() {
            const topWords = getWords('top-words-input');
            const bottomWords = getWords('bottom-words-input');
            document.getElementById('top-count').textContent = `${topWords.length}項目`;
            document.getElementById('bottom-count').textContent = `${bottomWords.length}項目`;
        }

        // Show Toast Notifications
        let toastTimeout;
        function showToast(msg, iconClass = 'fa-circle-exclamation text-amber-400') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = msg;
            toastIcon.className = `fa-solid ${iconClass}`;

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 3000);
        }

        // Helper: Pick Random Element
        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // Helper: Pick N Unique Random Elements
        function getRandomUniqueItems(arr, count) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // --- SINGLE SLOT LOGIC ---
        function startTopSpin() {
            if (isTopSpinning) return;

            const words = getWords('top-words-input');
            if (words.length === 0) {
                showToast('テーマを1つ以上入力してください。');
                return;
            }

            isTopSpinning = true;
            const btn = document.getElementById('top-btn');
            const display = document.getElementById('top-display');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            let steps = Math.floor(Math.random() * 15) + 25; // 25 to 40 steps
            let delay = 30; // initial speed (ms)

            function step() {
                if (steps > 0) {
                    display.textContent = getRandomItem(words);
                    playTickSound();
                    steps--;

                    // Deceleration curve
                    if (steps < 10) {
                        const factor = 10 - steps;
                        delay = 30 + Math.pow(factor, 1.6) * 15;
                    }

                    setTimeout(step, delay);
                } else {
                    // Final Selection
                    display.textContent = getRandomItem(words);
                    playStopSound();
                    isTopSpinning = false;
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }

            step();
        }

        // --- TRIPLE SLOT LOGIC ---
        function startBottomSpin() {
            if (isBottomSpinning) return;

            const words = getWords('bottom-words-input');
            if (words.length < 3) {
                showToast('セリフルーレットにはセリフが最低3つ必要です。');
                return;
            }

            isBottomSpinning = true;
            const btn = document.getElementById('bottom-btn');
            const displays = [
                document.getElementById('bottom-display-0'),
                document.getElementById('bottom-display-1'),
                document.getElementById('bottom-display-2')
            ];

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            let steps = Math.floor(Math.random() * 15) + 30; // 30 to 45 steps
            let delay = 35; // initial speed (ms)

            function step() {
                if (steps > 0) {
                    const currentThree = getRandomUniqueItems(words, 3);
                    displays.forEach((d, i) => {
                        d.textContent = currentThree[i];
                    });
                    playTickSound();
                    steps--;

                    // Deceleration curve
                    if (steps < 12) {
                        const factor = 12 - steps;
                        delay = 35 + Math.pow(factor, 1.6) * 16;
                    }

                    setTimeout(step, delay);
                } else {
                    // Final Selection (Guaranteed 3 unique)
                    const finalThree = getRandomUniqueItems(words, 3);
                    displays.forEach((d, i) => {
                        d.textContent = finalThree[i];
                    });
                    playStopSound();
                    isBottomSpinning = false;
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }

            step();
        }

        // Initialize on page load
        window.onload = function() {
            updateCounts();
        };
    </script>
</body>
</html>
